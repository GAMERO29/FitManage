sonar.projectKey=GAMERO29_FitManage
sonar.organization=gamero29
sonar.projectName=FitManage
sonar.sources=dominio,aplicacion,infraestructura,despliegue,config,prototipo
sonar.exclusions=**/migrations/**
# Igual que pytest-cov ([tool.coverage.run] en pyproject.toml): config/ es la configuración de
# Django y el prototipo es HTML estático; ninguno se mide con cobertura, solo se analiza.
sonar.coverage.exclusions=config/**,prototipo/**
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
