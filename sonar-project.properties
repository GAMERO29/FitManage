sonar.projectKey=GAMERO29_FitManage
sonar.organization=gamero29
sonar.projectName=FitManage
sonar.sources=dominio,aplicacion,infraestructura,despliegue,config,prototipo
sonar.exclusions=**/migrations/**
# Igual que pytest-cov ([tool.coverage.run] en pyproject.toml): config/ es la configuración de
# Django y el prototipo es HTML estático; ninguno se mide con cobertura, solo se analiza.
# Guía 16: los archivos de la pantalla de recepción (HTML, JS y CSS) tampoco tienen un reporte de
# cobertura, porque el JavaScript todavía no tiene pruebas automáticas (DT-25). Se siguen
# analizando por bugs y vulnerabilidades; la vista de Python que los sirve sí cuenta (100 %).
sonar.coverage.exclusions=config/**,prototipo/**,infraestructura/web/*.js,infraestructura/web/*.html,infraestructura/web/*.css
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
