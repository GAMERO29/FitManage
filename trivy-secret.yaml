# Configuración del escáner de secretos de Trivy (Guía 12, ADR N.° 12).
# Cada excepción explica por qué lo que encuentra Trivy no es un secreto real.
allow-rules:
  - id: jwt-de-ejemplo-del-contrato
    description: >
      Ejemplos de documentación en el contrato OpenAPI. El JWT no tiene firma real (termina en
      «.firma»), así que ningún servidor lo acepta. Solo se permite con ese final y en ese archivo.
    path: docs/api/openapi\.yaml
    regex: eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.firma
