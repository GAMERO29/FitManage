name: Calidad

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas-y-analisis:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: pip install -r requirements-dev.txt
      - name: Estilo y errores (ruff)
        run: ruff check .
      - name: Seguridad (bandit)
        run: bandit -q -r dominio aplicacion infraestructura config -x "*/migrations/*"
      - name: Complejidad ciclomática (radon, falla si algún bloque supera 10)
        run: |
          radon cc -s -a -e "*/migrations/*" dominio aplicacion infraestructura config
          test -z "$(radon cc -n C -e "*/migrations/*" dominio aplicacion infraestructura config)"
      - name: Pruebas y cobertura
        run: pytest --cov --cov-branch --cov-report=xml --cov-fail-under=95
      - name: Análisis en SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5

  contenedores:
    runs-on: ubuntu-latest
    needs: pruebas-y-analisis
    steps:
      - uses: actions/checkout@v4
      - name: Contraseña temporal para la base de datos de prueba
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Construir la imagen y correr las pruebas dentro del contenedor
        run: docker compose up --build --abort-on-container-exit --exit-code-from app
      - name: La aplicación alcanza PostgreSQL 16 por la red de compose
        run: |
          docker compose up -d db
          docker compose run --rm app python -c "import socket; socket.create_connection(('db', 5432), 5); print('PostgreSQL alcanzable')"
      - name: Apagar
        if: always()
        run: docker compose down -v

  contrato-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: El contrato OpenAPI no tiene errores ni advertencias (Redocly y Spectral)
        run: |
          npx --yes @redocly/cli@1.34.22 lint docs/api/openapi.yaml
          npx --yes @stoplight/spectral-cli@6.17.0 lint docs/api/openapi.yaml --ruleset docs/api/.spectral.yaml --fail-severity=warn
      - name: Mock del contrato con Prism
        run: |
          npx --yes @stoplight/prism-cli@5.14.2 mock docs/api/openapi.yaml -p 4010 > prism.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:4010/salud > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4010/salud
      - name: Colección de Postman contra el mock (newman)
        run: npx --yes newman@6.2.3 run docs/api/FitManage.postman_collection.json
      - name: Pact del consumidor (vista móvil); el pact guardado debe ser el que genera la prueba
        working-directory: vista-movil
        env:
          PACT_DO_NOT_TRACK: "true"
        run: |
          npm ci --no-audit --no-fund
          npm run test:pact
          git diff --exit-code pacts/
