name: Calidad

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas-y-analisis:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: pip install -r requirements-dev.txt
      - name: Estilo y errores (ruff)
        run: ruff check .
      - name: Seguridad (bandit)
        run: bandit -q -r dominio aplicacion infraestructura config -x "*/migrations/*"
      - name: Complejidad ciclomática (radon, falla si algún bloque supera 10)
        run: |
          radon cc -s -a -e "*/migrations/*" dominio aplicacion infraestructura config
          test -z "$(radon cc -n C -e "*/migrations/*" dominio aplicacion infraestructura config)"
      - name: Pruebas y cobertura
        run: pytest --cov --cov-branch --cov-report=xml --cov-fail-under=95
      - name: Análisis en SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5

  contenedores:
    runs-on: ubuntu-latest
    needs: pruebas-y-analisis
    steps:
      - uses: actions/checkout@v4
      - name: Contraseña temporal para la base de datos de prueba
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Construir la imagen y correr las pruebas dentro del contenedor
        run: docker compose up --build --abort-on-container-exit --exit-code-from app
      - name: La aplicación alcanza PostgreSQL 16 por la red de compose
        run: |
          docker compose up -d db
          docker compose run --rm app python -c "import socket; socket.create_connection(('db', 5432), 5); print('PostgreSQL alcanzable')"
      - name: Apagar
        if: always()
        run: docker compose down -v
