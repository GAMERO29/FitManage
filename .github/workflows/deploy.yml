# Despliegue continuo a Render (Guía 11, FPI-27, ADR N.° 11).
#
# Cada vez que el pipeline CI termina en verde sobre main, esta corrida:
#   1. le pide a Render, por su Deploy Hook, que despliegue exactamente la imagen sha-<commit>
#      que CI construyó, probó y publicó en GHCR (no se vuelve a construir nada);
#   2. corre el healthcheck posterior al despliegue (despliegue/verificar.py): /api/v1/salud
#      debe responder 200 con la versión de ese commit 3 veces seguidas, y /estados exigir token;
#   3. si pasa, mueve la etiqueta "estable" a esa imagen;
#   4. si no pasa, hace rollback: vuelve a desplegar la imagen "estable", la verifica y deja la
#      corrida en rojo para que el equipo se entere.
#
# Un push a una rama simulacro/rollback-* despliega una imagen rota a propósito para
# ensayar el rollback de punta a punta.
name: Despliegue

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    branches: ["simulacro/rollback-*"]

permissions:
  contents: read

concurrency:
  group: despliegue-produccion
  cancel-in-progress: false # nunca se corta un despliegue a la mitad

env:
  IMAGEN: ghcr.io/gamero29/fitmanage
  PYTHONUNBUFFERED: "1" # cada línea del healthcheck aparece en el log en el momento en que ocurre

jobs:
  desplegar:
    name: desplegar
    if: >
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # mover la etiqueta "estable" y publicar la imagen del simulacro
    environment:
      name: produccion
      url: ${{ vars.URL_PRODUCCION }}
    env:
      URL: ${{ vars.URL_PRODUCCION }}
      URL_PRODUCCION: ${{ vars.URL_PRODUCCION }}
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: El entorno tiene su secreto y su URL
        run: |
          if [ -z "$HOOK" ] || [ -z "$URL" ]; then
            echo "::error::Faltan RENDER_DEPLOY_HOOK o URL_PRODUCCION en el environment produccion."
            exit 1
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Versión estable actual (a la que se vuelve si algo falla)
        id: estable
        run: |
          version=$(docker buildx imagetools inspect "$IMAGEN:estable" --format '{{json .Image}}' 2>/dev/null \
            | python3 -c "import json,sys; e=json.load(sys.stdin)['config']['Env']; print(next(v.split('=',1)[1] for v in e if v.startswith('FITMANAGE_VERSION=')))" \
            || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versión estable: ${version:-ninguna todavía}"
      - name: Imagen candidata
        id: candidata
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          ESTABLE: ${{ steps.estable.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -z "$ESTABLE" ]; then echo "::error::El simulacro necesita una versión estable."; exit 1; fi
            version="simulacro-$GITHUB_RUN_ID"
            docker build -f despliegue/Dockerfile.simulacro \
              --build-arg BASE="$IMAGEN:sha-$ESTABLE" --build-arg VERSION="$version" \
              -t "$IMAGEN:$version" .
            docker push -q "$IMAGEN:$version"
            echo "imagen=$IMAGEN:$version" >> "$GITHUB_OUTPUT"
          else
            version="$SHA"
            echo "imagen=$IMAGEN:sha-$SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pedir el despliegue a Render
        env:
          IMG: ${{ steps.candidata.outputs.imagen }}
        run: python3 -m despliegue.render "$IMG"
      - name: Healthcheck posterior al despliegue
        id: salud
        continue-on-error: true # si falla, el paso de rollback decide y deja la corrida en rojo
        env:
          ESPERADA: ${{ steps.candidata.outputs.version }}
        run: python3 -m despliegue.verificar "$ESPERADA" --espera-max 900
      - name: Marcar la imagen como estable
        if: steps.salud.outcome == 'success' && github.event_name != 'push'
        env:
          IMG: ${{ steps.candidata.outputs.imagen }}
        run: |
          docker buildx imagetools create -t "$IMAGEN:estable" "$IMG"
          echo "### Desplegado y verificado: \`$IMG\` en $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Rollback a la versión estable
        if: steps.salud.outcome != 'success'
        env:
          ESTABLE: ${{ steps.estable.outputs.version }}
          FALLIDA: ${{ steps.candidata.outputs.imagen }}
        run: |
          echo "::error::$FALLIDA no pasó el healthcheck. Rollback."
          if [ -z "$ESTABLE" ]; then
            echo "::error::No hay versión estable a la cual volver: intervención manual en Render."
            exit 1
          fi
          python3 -m despliegue.render "$IMAGEN:sha-$ESTABLE"
          if python3 -m despliegue.verificar "$ESTABLE" --espera-max 900; then
            echo "### Rollback: \`$FALLIDA\` falló; quedó en línea \`sha-$ESTABLE\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::El rollback tampoco quedó sano: intervención manual en Render."
          fi
          exit 1
