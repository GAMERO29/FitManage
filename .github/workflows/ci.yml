# Pipeline de integración continua de FitManage (Guía 9, FPI-25, ADR N.° 09).
#
# Etapas, como las básculas del puente: si una falla, el código no cruza a main.
#   1. linter     estilo, seguridad del código, complejidad y dependencias vulnerables
#   2. pruebas    suite de regresión en paralelo con la puerta de cobertura (>= 95 %)
#   3. analisis   SonarCloud; el job espera el veredicto del Quality Gate y falla si no pasa
#   y en paralelo:
#   contrato-api  contrato OpenAPI, mock, Postman y Pact del consumidor
#   artefacto     construye UNA imagen de producción (multietapa, ADR N.° 10), corre la suite con la
#                 etapa de pruebas, pasa el humo de k6 contra la de producción y solo en main publica
#                 esa misma imagen en GHCR con el SHA del commit (inmutable)
#
# Todas las acciones van fijadas por el SHA de su commit: una etiqueta como @v7 se puede mover,
# un SHA no. La versión va en el comentario de la misma línea.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGEN: ghcr.io/gamero29/fitmanage

jobs:
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar herramientas
        run: pip install -r requirements-dev.txt
      - name: Estilo y errores (ruff)
        run: ruff check .
      - name: Seguridad del código (bandit)
        run: bandit -q -r dominio aplicacion infraestructura config despliegue -x "*/migrations/*"
      - name: Complejidad ciclomática (radon; falla si algún bloque supera 10)
        run: |
          radon cc -s -a -e "*/migrations/*" dominio aplicacion infraestructura config despliegue
          test -z "$(radon cc -n C -e "*/migrations/*" dominio aplicacion infraestructura config despliegue)"
      - name: Dependencias sin vulnerabilidades conocidas (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off

  pruebas:
    name: pruebas
    needs: linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Suite de regresión en paralelo y puerta de cobertura (líneas y ramas >= 95 %)
        run: pytest -n auto --cov --cov-branch --cov-report=xml --cov-report=term --cov-fail-under=95
      - name: Guardar el reporte de cobertura para el análisis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: coverage.xml
          retention-days: 7

  analisis:
    name: analisis
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarCloud necesita la historia para saber qué código es nuevo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura
      - name: El secreto SONAR_TOKEN existe (sin él, la puerta no se salta en silencio)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Falta el secreto SONAR_TOKEN. El Quality Gate no se puede evaluar, así que el build se detiene."
            exit 1
          fi
      - name: SonarCloud y espera del Quality Gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Si el Quality Gate falla, mostrar por qué (problemas abiertos del código nuevo)
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          filtro="componentKeys=GAMERO29_FitManage&resolved=false&inNewCodePeriod=true&ps=50"
          [ -n "$PR" ] && filtro="$filtro&pullRequest=$PR"
          curl -sf -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?$filtro" -o problemas.json
          python3 -c "
          import json
          for i in json.load(open('problemas.json'))['issues']:
              print(f\"{i['severity']:9} {i.get('type',''):14} {i['rule']:28} {i['component'].split(':',1)[-1]}:{i.get('line','-')}  {i['message']}\")"

  contrato-api:
    name: contrato-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: El contrato OpenAPI no tiene errores ni advertencias (Redocly y Spectral)
        run: |
          npx --yes @redocly/cli@1.34.22 lint docs/api/openapi.yaml
          npx --yes @stoplight/spectral-cli@6.17.0 lint docs/api/openapi.yaml --ruleset docs/api/.spectral.yaml --fail-severity=warn
      - name: Mock del contrato con Prism
        run: |
          npx --yes @stoplight/prism-cli@5.14.2 mock docs/api/openapi.yaml -p 4010 > prism.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:4010/salud > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4010/salud
      - name: Colección de Postman contra el mock (newman)
        run: npx --yes newman@6.2.3 run docs/api/FitManage.postman_collection.json
      - name: Pact del consumidor (vista móvil); el pact guardado debe ser el que genera la prueba
        working-directory: vista-movil
        env:
          PACT_DO_NOT_TRACK: "true"
        run: |
          npm ci --no-audit --no-fund
          npm run test:pact
          git diff --exit-code pacts/

  artefacto:
    name: artefacto
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # solo para publicar la imagen en GHCR desde main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitmanage
          POSTGRES_DB: fitmanage
          # Base efímera, solo en localhost del runner y destruida al terminar: no hay contraseña
          # que guardar ni que filtrar.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitmanage -d fitmanage"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://fitmanage@127.0.0.1:5432/fitmanage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Etiquetas inmutables de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Construir la imagen de producción una sola vez
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: produccion
          load: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Construir la etapa de pruebas (no se publica)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: pruebas
          load: true
          tags: fitmanage:pruebas
      - name: La suite completa contra PostgreSQL 16 (incluida QA-05)
        run: docker run --rm --network host -e DATABASE_URL fitmanage:pruebas
      - name: La imagen de producción no corre como root, no trae herramientas de desarrollo ni pip, y no tiene binarios setuid
        env:
          IMG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          test "$(docker run --rm "$IMG" id -u)" = "10001"
          if docker run --rm "$IMG" python -c "import pytest" 2>/dev/null; then echo "::error::pytest quedó en producción"; exit 1; fi
          if docker run --rm "$IMG" test -d /app/tests; then echo "::error::las pruebas quedaron en producción"; exit 1; fi
          if docker run --rm "$IMG" python -c "import pip" 2>/dev/null; then echo "::error::pip quedó en producción"; exit 1; fi
          privilegiados="$(docker run --rm --user 0 "$IMG" find / -xdev -perm /6000 -type f)"
          if [ -n "$privilegiados" ]; then echo "::error::binarios con setuid/setgid: $privilegiados"; exit 1; fi
      - name: Base de carga sembrada con el volumen de QA-01
        run: |
          psql -h 127.0.0.1 -U fitmanage -d fitmanage -c "CREATE DATABASE fitmanage_carga"
          docker run --rm --network host -e DATABASE_URL=postgresql://fitmanage@127.0.0.1:5432/fitmanage_carga \
            fitmanage:pruebas python pruebas_carga/sembrar.py
      - name: La imagen de producción sirve la API con su comando por defecto
        env:
          IMG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          # Claves de un solo uso para este contenedor; se enmascaran antes de usarlas (ADR N.° 12).
          JWT_CLAVE=$(openssl rand -hex 32); echo "::add-mask::$JWT_CLAVE" # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command
          DJANGO_SECRET_KEY=$(openssl rand -hex 32); echo "::add-mask::$DJANGO_SECRET_KEY" # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command
          docker run -d --name api --network host --read-only --tmpfs /tmp --cap-drop ALL \
            -e DATABASE_URL=postgresql://fitmanage@127.0.0.1:5432/fitmanage_carga \
            -e JWT_CLAVE="$JWT_CLAVE" -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            "$IMG"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/salud && break; sleep 1; done
          # La imagen dice qué commit es: el healthcheck del despliegue depende de esto (ADR N.° 11).
          curl -sf http://127.0.0.1:8000/api/v1/salud -o salud.json
          test "$(python3 -c 'import json; print(json.load(open("salud.json"))["version"])')" = "$GITHUB_SHA"
      - name: Arranque como en Render (base vacía, migraciones y PORT asignado por la plataforma)
        env:
          IMG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          psql -h 127.0.0.1 -U fitmanage -d fitmanage -c "CREATE DATABASE fitmanage_render"
          docker run -d --name render --network host --read-only --tmpfs /tmp --cap-drop ALL \
            -e DATABASE_URL=postgresql://fitmanage@127.0.0.1:5432/fitmanage_render \
            -e PORT=10000 -e JWT_CLAVE=x -e DJANGO_SECRET_KEY=y \
            -e RENDER_EXTERNAL_HOSTNAME=fitmanage-prueba.onrender.com \
            "$IMG" /app/arrancar.sh
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:10000/api/v1/salud && break; sleep 1; done
          curl -sf http://127.0.0.1:10000/api/v1/salud > /dev/null || { docker logs render; exit 1; }
          # El healthcheck interno de Render manda Host: <servicio>.onrender.com:<PORT>.
          curl -sf -H "Host: fitmanage-prueba.onrender.com:10000" http://127.0.0.1:10000/api/v1/salud > /dev/null \
            || { echo "::error::Django rechaza el Host del healthcheck de Render"; docker logs render; exit 1; }
          if docker logs render 2>&1 | grep -q "ERROR"; then docker logs render; exit 1; fi
          docker logs render 2>&1 | head -5
          docker rm -f render
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "1.5.0"
      - name: Humo de rendimiento con k6 (30 s, 5 VUs, mismos umbrales que QA-01)
        run: k6 run --stage 10s:5 --stage 20s:5 pruebas_carga/consulta_estado.js
      - name: Registro de la API si algo falló
        if: failure()
        run: docker logs api || true
      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar exactamente la imagen que se probó
        if: github.event_name == 'push'
        env:
          ETIQUETAS: ${{ steps.meta.outputs.tags }}
        run: |
          for etiqueta in $ETIQUETAS; do docker push "$etiqueta"; done
          {
            echo "### Imagen publicada"
            echo "| Etiqueta | Digest |"
            echo "| --- | --- |"
            for etiqueta in $ETIQUETAS; do
              echo "| \`$etiqueta\` | \`$(docker inspect --format '{{index .RepoDigests 0}}' "$etiqueta" | cut -d@ -f2)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
