# Umbrales de alerta del endpoint crítico (QA-01, RNF-01). Los mismos están dibujados en Grafana.
groups:
  - name: fitmanage-api
    rules:
      - alert: ErroresDelServidor
        # Más del 5 % de las peticiones terminan en 5xx durante un minuto seguido.
        expr: |
          sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[1m]))
            / sum(rate(http_server_request_duration_seconds_count[1m])) > 0.05
        for: 1m
        labels:
          severidad: critica
        annotations:
          resumen: "Más del 5 % de las peticiones a la API fallan con 5xx"
          que_hacer: "Revisar en Grafana qué ruta falla y buscar su trace_id en los logs JSON."

      - alert: ConsultaDeEstadoLenta
        # Alarma de ingeniería del ADR N.° 08: p95 por encima de 300 ms durante 5 minutos.
        # QA-01 (el negocio) recién se incumple en 2 s; esta avisa mucho antes.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(
            http_server_request_duration_seconds_bucket{http_route="/api/v1/estados/{tipoDocumento}/{numeroDocumento}"}[5m]
          ))) > 0.3
        for: 5m
        labels:
          severidad: aviso
        annotations:
          resumen: "La consulta de estado de recepción tiene un p95 mayor a 300 ms"
          que_hacer: "Comparar con la línea base de k6 (docs/pruebas/carga) y revisar las trazas lentas en Jaeger."
