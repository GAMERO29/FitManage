# Prometheus de FitManage (Guía 13, ADR N.° 13). Lee /metrics de la app cada 15 s con su token.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/slo.yml # SLI, SLO y alertas por consumo del presupuesto (ADR N.° 14)

scrape_configs:
  - job_name: fitmanage
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus-secretos/token
    static_configs:
      - targets: ["app:8000"]
