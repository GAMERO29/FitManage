[project]
name = "fitmanage"
version = "0.1.0"
description = "Núcleo de reglas de negocio de FitManage: membresías, pagos y acceso para gimnasios MiPyme"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["dominio"]
branch = true
