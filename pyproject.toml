[project]
name = "fitmanage"
version = "0.1.0"
description = "Núcleo de reglas de negocio de FitManage: membresías, pagos y acceso para gimnasios MiPyme"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.18",
    "psycopg[binary]==3.3.6",
    'tzdata; sys_platform == "win32"',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ"]

[tool.coverage.run]
source = ["dominio", "aplicacion", "infraestructura"]
omit = ["*/migrations/*"]
branch = true
