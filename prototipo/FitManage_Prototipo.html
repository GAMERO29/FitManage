:root{
  --marca:#23005A; --marca-2:#34106E; --marca-3:#5B3A99; --lav:#E2DAEF; --lav-2:#EFEAF7; --lav-3:#C9BCE0;
  --fondo:#F6F4FA; --sup:#FFFFFF; --tinta:#1C1A26; --tinta-2:#4A4560; --linea:#DDD6EA; --linea-2:#ECE7F4; --campo:#8E86A6;
  --verde:#1E8A4C; --verde-logo:#5EE08F; --verde-fondo:#E4F4EA; --verde-tinta:#0E4D2C;
  --rojo:#B42318; --rojo-fondo:#FBE9E7; --rojo-tinta:#7A1610;
  --gris:#77738A; --gris-fondo:#ECEAF1; --gris-tinta:#3D3A4D;
  --ambar:#B45309; --ambar-fondo:#FCF0DE; --ambar-tinta:#6E3505;
  --display:'Sora', 'Atkinson', system-ui, sans-serif; --ui:'Atkinson', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sombra:0 1px 2px rgba(35,0,90,.06), 0 6px 18px -8px rgba(35,0,90,.18);
  --r:14px; --r-s:10px;
}
*{box-sizing:border-box}
html{scrollbar-color:var(--lav-3) transparent}
body{margin:0;font-family:var(--ui);color:var(--tinta);background:var(--fondo);font-size:16px;line-height:1.5;caret-color:var(--marca);-webkit-font-smoothing:antialiased}
::selection{background:var(--lav);color:var(--marca)}
a{color:var(--marca-3);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--marca)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marca-3);outline-offset:2px;border-radius:6px}
.riel :focus-visible,.panel-marca :focus-visible{outline-color:#F2C14E}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tab{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);color:var(--marca);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:30px;font-weight:700;line-height:1.15} h2{font-size:19px;font-weight:600;line-height:1.25} h3{font-size:16px;font-weight:600}
.sub{color:var(--tinta-2)} .peq{font-size:14px} .mpeq{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Estructura */
.app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr);background:linear-gradient(90deg,var(--marca) 248px,transparent 248px)}
.riel{background:var(--marca);color:#fff;padding:22px 14px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.marca{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff;text-decoration:none}
.marca svg{flex:0 0 auto}
.marca b{font-family:var(--display);font-size:21px;letter-spacing:-.03em;font-weight:700}
.marca b span{font-weight:500}
.sede{padding:0 8px;margin-top:-14px;font-size:13px;color:var(--lav)}
.grupo{display:flex;flex-direction:column;gap:2px}
.grupo-t{padding:10px 10px 4px;font-size:13px;color:var(--lav3,#BFB2D9)}
.riel nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px;border-radius:10px;color:#F3EFFA;text-decoration:none;font-size:15px}
.riel nav a svg{opacity:.85}
.riel nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.riel nav a[aria-current="page"]{background:#fff;color:var(--marca);font-weight:700}
.riel nav a[aria-current="page"] svg{opacity:1}
.conexion{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--marca-2);font-size:13px;color:var(--lav)}
.conexion i{width:9px;height:9px;border-radius:50%;background:var(--verde-logo);flex:0 0 auto;box-shadow:0 0 0 3px rgba(94,224,143,.2)}
.usuario{display:flex;align-items:center;gap:10px;padding:4px 8px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--lav);color:var(--marca);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:0 0 auto}
.usuario div{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.usuario small{color:var(--lav);font-size:13px}
.salir{all:unset;cursor:pointer;margin-left:auto;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--lav)}
.salir:hover{background:rgba(255,255,255,.1);color:#fff}
.demo{font-size:12px;color:#BFB2D9;padding:0 8px;line-height:1.4}
main{min-width:0;padding:34px 40px 48px;display:flex;flex-direction:column;gap:24px;max-width:1240px}
main:focus{outline:none}
.cabecera{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.cabecera .sub{margin-top:4px}
.volver{display:inline-flex;align-items:center;gap:6px;font-size:15px;margin-bottom:6px;min-height:32px}

/* Superficies */
.hoja{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);padding:22px;box-shadow:var(--sombra)}
.hoja>h2+*{margin-top:14px}
.pila{display:flex;flex-direction:column;gap:14px}
.fila{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.dos{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.rejilla{display:grid;gap:14px}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))} .r4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* Campos y botones */
label.et{font-size:15px;font-weight:700;color:var(--tinta)}
.campo{display:flex;flex-direction:column;gap:6px}
.ayuda{font-size:13px;color:var(--tinta-2)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],select,textarea{min-height:48px;padding:0 14px;border:1px solid var(--campo);border-radius:var(--r-s);background:#fff;font-size:16px;width:100%}
input::placeholder,textarea::placeholder{color:#6F6985}
input:hover,select:hover,textarea:hover{border-color:var(--marca-3)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--lav-3);outline-offset:0;border-color:var(--marca)}
textarea{padding:12px 14px;min-height:96px;resize:vertical}
.error-campo{border-color:var(--rojo)!important;background:#FFFBFA!important}
.msg-error{font-size:14px;color:var(--rojo-tinta);display:flex;gap:6px;align-items:flex-start}
.btn{min-height:48px;padding:0 22px;border:0;border-radius:var(--r-s);background:var(--marca);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:0 1px 2px rgba(35,0,90,.2),0 4px 10px -4px rgba(35,0,90,.45);transition:background-color .15s, transform .15s}
.btn:hover{background:var(--marca-2);color:#fff}
.btn:active{transform:translateY(1px)}
.btn[disabled]{background:#C9C4D6;color:#3D3A4D;box-shadow:none;cursor:not-allowed}
.btn-peligro{background:var(--rojo);box-shadow:0 1px 2px rgba(122,22,16,.2),0 4px 10px -4px rgba(122,22,16,.5)} .btn-peligro:hover{background:var(--rojo-tinta)}
.btn-sec{min-height:44px;padding:0 16px;border:1px solid var(--linea);border-radius:var(--r-s);background:#fff;color:var(--marca);cursor:pointer;font-size:15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn-sec:hover{border-color:var(--marca-3);background:var(--lav-2);color:var(--marca)}
.btn-sec[disabled]{opacity:.5;cursor:not-allowed}
.btn-sec.peligro{color:var(--rojo-tinta);border-color:#EBC3BE} .btn-sec.peligro:hover{background:var(--rojo-fondo);border-color:var(--rojo)}
.opcion{min-height:96px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:14px 16px;border-radius:var(--r-s);border:1px solid var(--linea);background:#fff;cursor:pointer;text-align:left}
.opcion:hover{border-color:var(--marca-3)}
.opcion b{font-family:var(--display);font-size:17px;color:var(--marca)}
.opcion .precio{font-family:var(--display);font-weight:600;font-size:16px;margin-top:4px}
.opcion[aria-pressed="true"]{border:2px solid var(--marca);background:var(--lav-2);padding:13px 15px}
.opcion[disabled]{cursor:default}
.chip{min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--campo);background:#fff;cursor:pointer;font-size:16px}
.chip:hover{border-color:var(--marca)}
.chip[aria-pressed="true"]{border-color:var(--marca);background:var(--marca);color:#fff;font-weight:700}
.ejemplo{min-height:36px;padding:0 12px;border:1px dashed var(--lav-3);border-radius:999px;background:transparent;color:var(--marca-3);font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.ejemplo:hover{border-style:solid;background:#fff}

/* Estados */
.pastilla{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.pastilla::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.p-ok{background:var(--verde-fondo);color:var(--verde-tinta)} .p-mal{background:var(--rojo-fondo);color:var(--rojo-tinta)} .p-neutro{background:var(--gris-fondo);color:var(--gris-tinta)} .p-aviso{background:var(--ambar-fondo);color:var(--ambar-tinta)}
.aviso{border-radius:var(--r-s);padding:14px 16px;font-size:15px;display:flex;gap:12px;align-items:flex-start}
.aviso svg{flex:0 0 auto;margin-top:2px}
.a-ok{background:var(--verde-fondo);color:var(--verde-tinta)} .a-mal{background:var(--rojo-fondo);color:var(--rojo-tinta)} .a-aviso{background:var(--ambar-fondo);color:var(--ambar-tinta)} .a-neutro{background:var(--gris-fondo);color:var(--gris-tinta)}

/* Consulta */
.consulta{display:flex;flex-direction:column;gap:12px}
.buscador{display:flex;gap:10px;flex-wrap:wrap}
.buscador input{flex:1 1 260px;min-height:64px;border:2px solid var(--marca);font-family:var(--display);font-size:28px;letter-spacing:.02em;font-variant-numeric:tabular-nums;padding:0 18px}
.buscador .btn{min-height:64px;padding:0 28px;font-size:17px}
.ejemplos{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--tinta-2)}

.resultado{border-radius:20px;padding:28px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.r-ok{background:var(--verde-fondo);color:var(--verde-tinta)}
.r-aviso{background:var(--ambar-fondo);color:var(--ambar-tinta)}
.r-mal{background:var(--rojo-fondo);color:var(--rojo-tinta)}
.r-neutro{background:var(--gris-fondo);color:var(--gris-tinta)}
.r-vacio{background:transparent;border:2px dashed var(--lav-3);color:var(--tinta-2);grid-template-columns:auto minmax(0,1fr)}
.estado{font-family:var(--display);font-size:52px;font-weight:800;line-height:1;letter-spacing:-.035em}
.estado-sub{font-size:19px;font-weight:700;margin-top:6px}
.datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(28,26,38,.12)}
.dato span{display:block;font-size:13px;opacity:.85}
.dato strong{color:var(--tinta);font-size:16px}
.acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

/* Anillo de vigencia */
.anillo{position:relative;display:grid;place-items:center;flex:0 0 auto}
.anillo svg{display:block;transform:rotate(-90deg)}
.anillo .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.anillo .centro b{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.04em;color:var(--tinta)}
.anillo .centro span{font-size:13px;color:var(--tinta-2);margin-top:4px}
.arco{animation:dibujar .9s cubic-bezier(.16,1,.3,1) both}
@keyframes dibujar{from{stroke-dasharray:0 1000}}
@media (prefers-reduced-motion:reduce){.arco{animation:none}*{transition:none!important}}

/* Vencimientos */
.venc{display:flex;flex-direction:column}
.venc-fila{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--linea-2)}
.venc-fila:last-of-type{border-bottom:0}
.venc-fila>div:not(.anillo){flex:1 1 auto;min-width:0}
.venc-fila b{display:block}
.venc-fila .cuando{font-family:var(--display);font-weight:700;color:var(--ambar-tinta);font-size:15px;text-align:right;flex:0 0 auto}

/* Tablas */
.tabla-caja{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:640px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:13px;font-weight:700;color:var(--tinta-2);border-bottom:1px solid var(--linea);padding:10px 10px}
td{border-bottom:1px solid var(--linea-2);padding:13px 10px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.der,th.der{text-align:right}
.anulada td{color:var(--gris)}
.anulada td:first-child b{text-decoration:line-through}

/* Pago */
.socio-cab{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.socio-cab .nombre{font-family:var(--display);font-size:22px;font-weight:700;color:var(--marca);letter-spacing:-.02em}
.periodo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.linea-fechas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px}
.linea-fechas strong{font-family:var(--display);font-size:24px;font-weight:700;color:var(--tinta);font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block}
.leyenda{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--tinta-2)}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.paso{display:flex;align-items:baseline;gap:10px}
.paso em{font-style:normal;font-family:var(--display);font-weight:700;width:28px;height:28px;border-radius:50%;background:var(--marca);color:#fff;display:inline-grid;place-items:center;font-size:14px;flex:0 0 auto;transform:translateY(-2px)}

/* Reportes */
.resumen{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 40px}
.resumen .total{font-family:var(--display);font-size:44px;font-weight:800;color:var(--marca);letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.barra{display:flex;height:18px;border-radius:999px;overflow:hidden;gap:3px;margin-top:18px}
.barra span{display:block;height:100%}
.punto{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.panel-marca{background:var(--marca);color:#fff;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:36px;position:relative;overflow:hidden}
.panel-marca .grande{position:absolute;right:56px;top:56px;pointer-events:none}
.panel-marca .lema{font-family:var(--display);font-size:44px;font-weight:700;line-height:1.1;letter-spacing:-.035em;max-width:13ch;position:relative}
.panel-marca p{color:var(--lav);max-width:38ch;margin:16px 0 0;font-size:17px;position:relative}
.panel-marca .pie{font-size:13px;color:#BFB2D9;position:relative}
.panel-form{padding:48px 24px;display:flex;align-items:center;justify-content:center}
.panel-form form{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.rol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rol label{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--linea);border-radius:var(--r-s);cursor:pointer;background:#fff}
.rol label:has(input:checked){border:2px solid var(--marca);background:var(--lav-2);padding:11px 13px}
.rol input{position:absolute;opacity:0}
.rol label:has(input:focus-visible){outline:3px solid var(--marca-3);outline-offset:2px}
.rol b{color:var(--marca)}

/* Teléfono */
.telefono{width:360px;max-width:100%;border:10px solid #1C1A26;border-radius:44px;overflow:hidden;background:var(--fondo);display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(35,0,90,.5)}
.tel-cab{background:var(--marca);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700}
.tel-cuerpo{padding:16px;display:flex;flex-direction:column;gap:14px;min-height:640px}
.tel-cuerpo .resultado{grid-template-columns:1fr;justify-items:center;text-align:center;padding:22px 16px;gap:14px}
.tel-cuerpo .estado{font-size:38px}

@media (max-width:1080px){.dos{grid-template-columns:1fr} main{padding:28px 28px 40px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .riel{position:static;height:auto;padding:12px 14px;gap:10px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .sede,.conexion,.demo,.grupo-t,.usuario div{display:none}
  .usuario{margin-left:auto;padding:0}
  .riel nav{order:5;flex:1 1 100%;display:flex;overflow-x:auto;gap:4px;margin:0 -14px;padding:2px 14px 4px;scrollbar-width:none}
  .riel nav .grupo{flex-direction:row;gap:4px}
  .riel nav a{white-space:nowrap;min-height:40px;font-size:14px;padding:0 12px}
  .riel nav a svg{display:none}
  .login{grid-template-columns:1fr}
  .panel-marca{padding:32px 24px;gap:20px}
  .panel-marca .lema{font-size:30px}
  .panel-marca .grande{display:none}
  .app{background:none}
  .r4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  main{padding:20px 16px 36px;gap:20px}
  h1{font-size:25px}
  .resultado{grid-template-columns:1fr;justify-items:start;padding:22px;gap:18px}
  .estado{font-size:40px}
  .datos{grid-template-columns:1fr 1fr}
  .periodo{grid-template-columns:1fr}
  .linea-fechas{grid-template-columns:1fr 1fr}
  .linea-fechas strong{font-size:20px}
  .r2{grid-template-columns:1fr}
  .buscador input{font-size:24px;min-height:58px}
  .buscador .btn{min-height:58px;flex:1 1 100%}
  .resumen .total{font-size:36px}
}

  const ico = (n, t) => `<svg width="${t || 20}" height="${t || 20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]}</svg>`;

  /* El anillo de vigencia: segmentos [{v, color}] sobre un total de días */
  function anillo(segs, total, opc) {
    const t = opc.t || 180, g = opc.g || Math.round(t * 0.09), r = (t - g) / 2, c = 2 * Math.PI * r;
    let acum = 0;
    const arcos = segs.filter((s) => s.v > 0).map((s) => {
      const largoArco = Math.max(0, (s.v / total) * c - (segs.length > 1 ? 3 : 0));
      const html = `<circle class="arco" cx="${t / 2}" cy="${t / 2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${g}" stroke-linecap="${s.v >= total ? 'butt' : 'round'}" stroke-dasharray="${largoArco} ${c}" stroke-dashoffset="${-acum}"/>`;
      acum += (s.v / total) * c;
      return html;
    }).join('');
    const pista = `<circle cx="${t / 2}" cy="${t / 2}" r="${r}" fill="none" stroke="${opc.pista || 'rgba(35,0,90,.1)'}" stroke-width="${g}" ${opc.punteada ? `stroke-dasharray="${g * 0.35} ${g * 0.9}"` : ''}/>`;
    return `<div class="anillo" style="width:${t}px;height:${t}px" ${opc.etiqueta ? `role="img" aria-label="${esc(opc.etiqueta)}"` : 'aria-hidden="true"'}>
      <svg width="${t}" height="${t}" viewBox="0 0 ${t} ${t}">${pista}${arcos}</svg>
      <div class="centro">${opc.centro || ''}</div></div>`;
  }
  function estadoDe(s) {
    if (!s || s.estado === 'SIN_MEMBRESIA') return { clave: 'neutro' };
    const v = leer(s.vence), quedan = entre(HOY, v) + 1, total = plan(s.plan)[1];
    if (quedan <= 0) return { clave: 'mal', mora: entre(v, HOY), total, v };
    return { clave: quedan <= 3 ? 'aviso' : 'ok', quedan, total, v };
  }
  const COLOR = { ok: '#1E8A4C', aviso: '#B45309', mal: '#B42318', neutro: '#77738A' };
  function anilloSocio(s, t) {
    const e = estadoDe(s);
    const n = (x) => `<b style="font-size:${Math.round(t * 0.3)}px">${x}</b>`;
    if (e.clave === 'neutro') return anillo([], 1, { t, punteada: true, pista: 'rgba(61,58,77,.35)', centro: `${n('0')}<span>días</span>`, etiqueta: 'Sin membresía' });
    if (e.clave === 'mal') return anillo([], 1, { t, pista: 'rgba(180,35,24,.22)', centro: `${n(e.mora)}<span>${e.mora === 1 ? 'día' : 'días'} de mora</span>`, etiqueta: `Vencido hace ${e.mora} días` });
    return anillo([{ v: e.quedan, color: COLOR[e.clave] }], e.total, { t, pista: e.clave === 'ok' ? 'rgba(30,138,76,.16)' : 'rgba(180,83,9,.16)', centro: `${n(e.quedan)}<span>de ${e.total} días</span>`, etiqueta: `Le quedan ${e.quedan} de ${e.total} días` });
  }

          <div class="campo"><label class="et" for="nom">Nombres</label><input id="nom" type="text" value="María Fernanda"></div>
          <div class="campo"><label class="et" for="ape">Apellidos</label><input id="ape" type="text" value="Gil"></div>
          <div class="campo"><label class="et" for="tel">Celular (10 dígitos)</label><input id="tel" type="tel" inputmode="numeric" value="3000000004" style="font-variant-numeric:tabular-nums"><span class="ayuda">Se usa para el recordatorio por WhatsApp.</span></div>
        </div>
        <div style="background:var(--lav-2);border:1px solid ${falta ? 'var(--rojo)' : 'var(--linea)'};border-radius:var(--r-s);padding:18px;display:flex;flex-direction:column;gap:10px">
          <h3>Autorización de tratamiento de datos</h3>
          <p class="peq" style="margin:0;color:var(--tinta-2);max-width:72ch">Autorizo al gimnasio a guardar mi nombre, documento y celular para administrar mi membresía y enviarme recordatorios de vencimiento por WhatsApp. Puedo pedir en la recepción que consulten, corrijan o borren mis datos (Ley 1581 de 2012).</p>
          <label style="display:flex;align-items:center;gap:12px;min-height:44px;font-weight:700"><input type="checkbox" data-cambio="autoriza" ${X.autoriza ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--marca)">El socio leyó y acepta la autorización</label>
          ${falta ? `<div class="msg-error" role="alert">${ico('alerta', 18)}Sin la autorización del socio no se puede guardar el registro.</div>` : ''}
        </div>
        ${X.ok ? `<div class="aviso a-ok" role="status" style="flex-wrap:wrap;align-items:center;justify-content:space-between">${ico('ok')}<span style="flex:1 1 240px"><b>Socio registrado.</b> Por ahora no tiene membresía.</span><a class="btn" href="#pago" data-accion="escenario" data-valor="vencido" data-socio="${esc(X.numero.trim())}">Registrar su primer pago</a></div>` : ''}
        <div class="fila"><button class="btn" type="submit">Guardar socio</button><span class="sub mpeq">Pruebe el número 1090123456 o quite la autorización para ver las validaciones.</span></div>
      </form>`);
  }

  function pVencimientos() {
    return marco(`<div class="cabecera"><div><h1>Próximos vencimientos</h1><div class="sub">De hoy, ${fmt(HOY).slice(0, 5)}, al ${fmt(sumarDias(HOY, 3)).slice(0, 5)}, ambos incluidos.</div></div></div>
      <section class="hoja">${vencimientosTabla()}</section>
      <p class="sub peq" style="margin:0;max-width:72ch">El botón abre WhatsApp con el mensaje escrito; quien lo envía es la recepcionista (RF-06). Esta pantalla no muestra ingresos.</p>`);
  }

  function pHistorial() {
    const H = S.hist, an = H.anulado;
    const fila = (pl, per, medio, ref, valor, reg, vig, nota) => `<tr class="${vig ? '' : 'anulada'}"><td><b>${pl}</b></td><td>${per}</td><td>${medio}</td><td>${ref}</td><td class="der">${pesos(valor)}</td><td>${reg}</td><td><span class="pastilla ${vig ? 'p-ok' : 'p-neutro'}">${vig ? 'Vigente' : 'Anulado'}</span>${nota ? `<div class="mpeq sub" style="margin-top:4px">${nota}</div>` : ''}</td></tr>`;
    const s = SOC['1090123456'];
    return marco(`<div class="hoja" style="display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px">
        ${anilloSocio(s, 112)}
        <div style="flex:1 1 260px"><h1>Ana Pérez</h1><div class="sub tab" style="margin-top:4px">CC 1090123456 · 300 000 0005</div><div class="sub peq">Socia desde el 25/05/2026 · autorizó el tratamiento de datos el 25/05/2026 a las 09:14</div></div>
        <span class="pastilla ${an ? 'p-mal' : 'p-ok'}" style="font-size:15px;padding:8px 14px">${an ? 'Vencida desde el 22/09/2026' : 'Activa hasta el 21/10/2026'}</span></div>
      <section class="hoja" aria-labelledby="t-h"><div class="cabecera" style="align-items:center"><h2 id="t-h">Historial de pagos</h2><button type="button" class="btn-sec peligro" data-accion="abrir-anulacion" ${an || H.confirmando ? 'disabled' : ''}>Anular último pago</button></div>
        <div class="tabla-caja" style="margin-top:10px"><table><thead><tr><th scope="col">Plan</th><th scope="col">Periodo</th><th scope="col">Medio</th><th scope="col">Referencia</th><th scope="col" class="der">Valor</th><th scope="col">Registró</th><th scope="col">Estado</th></tr></thead><tbody>
          ${fila('Mensual', '22/09/2026 – 21/10/2026', 'Efectivo', '—', 75000, 'Laura · 22/09 18:02', !an, an ? 'Anuló Carlos: ' + esc(H.motivo) : '')}
          ${fila('Mensual', '23/08/2026 – 21/09/2026', 'Nequi', 'M555012', 75000, 'Laura · 23/08 17:40', true, '')}
          ${fila('Trimestral', '25/05/2026 – 22/08/2026', 'Efectivo', '—', 200000, 'Carlos · 25/05 09:20', true, '')}
        </tbody></table></div></section>
      ${H.confirmando ? `<section class="hoja pila" style="border:2px solid var(--rojo);max-width:680px" aria-labelledby="t-an">
        <h2 id="t-an" style="color:var(--rojo-tinta)">¿Anular el pago Mensual del 22/09/2026 al 21/10/2026?</h2>
        <p class="sub peq" style="margin:0">El pago no se borra. Queda anulado con el motivo, quién lo anuló y la fecha; deja de sumar en los ingresos y la membresía se recalcula. Solo se puede anular el último pago vigente (RN-07).</p>
        <div class="campo"><label class="et" for="motivo">Motivo de la anulación</label><textarea id="motivo" data-campo="hist.motivo" placeholder="Ej.: se registró Mensual y el socio pagó Quincenal" class="${H.falta ? 'error-campo' : ''}">${esc(H.motivo)}</textarea>
        ${H.falta ? `<div class="msg-error" role="alert">${ico('alerta', 18)}Escriba el motivo para poder anular.</div>` : ''}</div>
        <div class="fila"><button type="button" class="btn btn-peligro" data-accion="confirmar-anulacion">Anular pago</button><button type="button" class="btn-sec" data-accion="cancelar-anulacion">No anular</button></div></section>` : ''}
      ${an ? `<div class="aviso a-aviso" role="status">${ico('alerta')}<div>Pago anulado y guardado en la auditoría. Ana quedó vencida desde el 22/09/2026; ya se puede registrar el plan correcto. <a href="#pago" data-accion="escenario" data-valor="vencido" data-socio="1090123456">Registrar pago</a></div></div>` : ''}`);
  }

  function pReportes() {
    const R = [['Efectivo', 16, 722000, '#23005A'], ['Nequi', 10, 690000, '#5B3A99'], ['Daviplata', 4, 270000, '#9A84C7'], ['Transferencia', 3, 475000, '#1E8A4C']];
    const total = R.reduce((a, r) => a + r[2], 0), pagos = R.reduce((a, r) => a + r[1], 0);
    return marco(`<div class="cabecera"><div><h1>Reporte de ingresos</h1><div class="sub">Solo el administrador lo ve. Los pagos anulados no suman.</div></div>
        <form class="fila" style="align-items:flex-end" data-envio="nada"><div class="campo"><label class="et" for="desde">Desde</label><input id="desde" type="date" value="2026-10-01"></div><div class="campo"><label class="et" for="hasta">Hasta</label><input id="hasta" type="date" value="2026-10-07"></div><button class="btn" type="submit">Ver reporte</button></form></div>
      <section class="hoja" aria-labelledby="t-r">
        <h2 id="t-r" class="sr">Totales del 1 al 7 de octubre</h2>
        <div class="resumen"><div><div class="sub peq">Ingresos del 1 al 7 de octubre</div><div class="total">${pesos(total)}</div></div><div class="sub">${pagos} pagos · 1 anulado por ${pesos(75000)} que no se cuenta</div></div>
        <div class="barra" role="img" aria-label="Reparto de ingresos por medio de pago">${R.map((r) => `<span style="flex:${r[2]};background:${r[3]}"></span>`).join('')}</div>
        <div class="tabla-caja" style="margin-top:14px"><table style="min-width:520px"><thead><tr><th scope="col">Medio de pago</th><th scope="col" class="der">Pagos</th><th scope="col" class="der">Total</th><th scope="col" class="der">Parte</th></tr></thead><tbody>
          ${R.map((r) => `<tr><td><span class="punto" style="background:${r[3]}"></span><b>${r[0]}</b></td><td class="der">${r[1]}</td><td class="der">${pesos(r[2])}</td><td class="der">${(r[2] / total * 100).toLocaleString('es-CO', { maximumFractionDigits: 1 })} %</td></tr>`).join('')}
        </tbody></table></div>
      </section>
      <section class="hoja" aria-labelledby="t-v"><div class="cabecera" style="align-items:center"><h2 id="t-v">Próximos vencimientos</h2><span class="sub peq">Del ${fmt(HOY).slice(0, 5)} al ${fmt(sumarDias(HOY, 3)).slice(0, 5)}</span></div>${vencimientosTabla()}</section>`);
  }

  function pPlanes() {
    const G = S.planes;
    return marco(`<div class="cabecera"><div><h1>Planes</h1><div class="sub">Cambiar un precio solo afecta los pagos nuevos; las membresías ya pagadas no cambian.</div></div></div>
      <form class="hoja" data-envio="planes">
        <div class="tabla-caja"><table style="min-width:600px"><thead><tr><th scope="col">Plan</th><th scope="col">Duración</th><th scope="col">Socios activos</th><th scope="col">Precio</th></tr></thead><tbody>
        ${PLANES.map((p) => `<tr><td><b>${p[0]}</b></td><td>${p[1]} ${p[1] === 1 ? 'día' : 'días'}</td><td><div style="display:flex;align-items:center;gap:10px">${anillo([{ v: p[3], color: '#5B3A99' }], 148, { t: 30, g: 4 })}<b>${p[3]}</b></div></td><td><div style="display:flex;align-items:center;gap:8px;max-width:200px"><span class="sub">$</span><input type="text" inputmode="numeric" aria-label="Precio del plan ${p[0]}" value="${precio(p[0]).toLocaleString('es-CO')}" data-precio="${p[0]}" style="min-height:44px;font-variant-numeric:tabular-nums"></div></td></tr>`).join('')}
        </tbody></table></div>
        <div class="fila" style="margin-top:16px"><button class="btn" type="submit">Guardar precios</button>${G.guardado ? `<span class="pastilla p-ok">Precios guardados</span>` : '<span class="sub mpeq">El anillo muestra la parte de los 148 socios activos que tiene cada plan.</span>'}</div>
      </form>`);
  }

  function pPersonal() {
    const X = S.personal;
    const filas = [
      ['Carlos', 'carlos@gimnasio-demo.co', 'Administrador', 'Activa', 'Hoy 07:58'],
      ['Laura', 'laura@gimnasio-demo.co', 'Recepcionista', 'Activa', 'Hoy 13:02'],
      ['Diego Salcedo', 'diego@gimnasio-demo.co', 'Recepcionista', X.desbloqueado ? 'Activa' : 'Bloqueada', 'Ayer 21:10']
    ];
    return marco(`<div class="cabecera"><div><h1>Cuentas del personal</h1><div class="sub">Cada persona tiene su propia cuenta. Las contraseñas nunca se muestran.</div></div><button type="button" class="btn" data-accion="nada">Crear cuenta</button></div>
      <section class="hoja"><div class="tabla-caja"><table><thead><tr><th scope="col">Nombre</th><th scope="col">Correo</th><th scope="col">Rol</th><th scope="col">Estado</th><th scope="col">Último ingreso</th><th scope="col"><span class="sr">Acciones</span></th></tr></thead><tbody>
        ${filas.map((f) => `<tr><td><div style="display:flex;align-items:center;gap:10px"><span class="avatar" style="width:32px;height:32px;font-size:13px">${f[0][0]}</span><b>${f[0]}</b></div></td><td>${f[1]}</td><td>${f[2]}</td><td><span class="pastilla ${f[3] === 'Activa' ? 'p-ok' : 'p-mal'}">${f[3]}</span>${f[3] === 'Bloqueada' ? '<div class="mpeq sub" style="margin-top:4px">5 intentos fallidos · se desbloquea sola a las 21:25</div>' : ''}</td><td>${f[4]}</td><td class="der">${f[0] === 'Diego Salcedo' && !X.desbloqueado ? '<button type="button" class="btn-sec" data-accion="desbloquear">Desbloquear</button>' : f[0] === 'Laura' ? `<button type="button" class="btn-sec" data-accion="restablecer" ${X.restablecida ? 'disabled' : ''}>${X.restablecida ? 'Enlace enviado' : 'Restablecer contraseña'}</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div></section>
      ${X.desbloqueado ? `<div class="aviso a-ok" role="status">${ico('ok')}<div>La cuenta de Diego Salcedo quedó desbloqueada y el cambio se guardó en la auditoría.</div></div>` : ''}
      ${X.restablecida ? `<div class="aviso a-neutro" role="status">${ico('ok')}<div>Se envió a laura@gimnasio-demo.co un enlace para crear una contraseña nueva. Vence en 30 minutos.</div></div>` : ''}`);
  }

  function pMovil() {
    const M = S.movil;
    return marco(`<div class="cabecera"><div><h1>Vista móvil sin conexión</h1><div class="sub">Si se cae el internet, el celular del personal sigue consultando con la copia guardada. Solo se puede consultar: los pagos esperan a que vuelva la conexión.</div></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
        <div class="telefono" aria-label="Simulación de celular">
          <div class="tel-cab">${marcaSvg(26)}<span>FitManage</span></div>
          <div class="tel-cuerpo">
            <div class="aviso a-aviso peq">${ico('nube', 18)}<div><b>Sin conexión.</b> Datos guardados hoy a las 18:45.</div></div>
            <form data-envio="movil" class="pila" style="gap:10px">
              <label class="et" for="doc-m">Documento del socio</label>
              <div style="display:flex;gap:8px"><input id="doc-m" type="text" inputmode="numeric" autocomplete="off" value="${esc(M.doc)}" data-campo="movil.doc" style="font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;border:2px solid var(--marca)"><button class="btn" type="submit" style="padding:0 16px">Ver</button></div>
              <div class="ejemplos">${['1090123456', '1093445566', '25789456'].map((d) => `<button type="button" class="ejemplo" data-accion="ejemplo-m" data-valor="${d}">${d}</button>`).join('')}</div>
            </form>
            ${resultadoConsulta(M.buscado, true)}
            <button type="button" class="btn" disabled style="width:100%">Registrar pago (requiere conexión)</button>
          </div>
        </div>
        <div class="pila" style="flex:1 1 260px;max-width:440px">
          <h2>Qué guarda la copia</h2>
          <p class="sub" style="margin:0">Nombre, documento, estado y fecha de vencimiento de cada socio. No guarda pagos, teléfonos ni ingresos, para que un celular perdido no exponga datos sensibles.</p>
          <h2 style="margin-top:12px">Cuándo se actualiza</h2>
          <p class="sub" style="margin:0">Cada vez que hay conexión y cada 15 minutos. La hora de la última copia siempre se ve arriba, para saber qué tan reciente es la respuesta.</p>
        </div>
      </div>`);
  }

  function pDenegado() {
    return marco(`<div class="hoja pila" style="max-width:640px">
      <span class="pastilla p-mal" style="align-self:flex-start">Acceso denegado · 403</span>
      <h1>Esta sección es solo para el administrador</h1>
      <p class="sub" style="margin:0">«${TITULOS[ruta()] || ruta()}» no está disponible para su cuenta. El servidor también lo bloquea si se escribe la dirección a mano, y el intento queda en la auditoría (RNF-05).</p>
      <div><a class="btn" href="#recepcion">Volver a recepción</a></div></div>`);
  }

  const PANTALLAS = { login: pLogin, recepcion: pRecepcion, pago: pPago, socio: pSocio, vencimientos: pVencimientos, historial: pHistorial, reportes: pReportes, planes: pPlanes, personal: pPersonal, movil: pMovil };
  function render() {
    let r = ruta();
    if (!PANTALLAS[r]) r = 'login';
    if (r !== 'login' && !S.rol) { location.hash = 'login'; return; }
    const html = RUTAS_ADMIN.includes(r) && S.rol !== 'admin' ? pDenegado() : PANTALLAS[r]();
    document.getElementById('app').innerHTML = html;
    document.title = 'FitManage · ' + (TITULOS[r] || 'Prototipo');
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); const m = document.getElementById('contenido'); if (m) m.focus({ preventScroll: true }); });
  document.addEventListener('input', (e) => {
    const k = e.target.getAttribute('data-campo');
    if (k) { const [a, b] = k.split('.'); S[a][b] = e.target.value; if (a === 'pago') S.pago.error = null; }
    const pr = e.target.getAttribute('data-precio');
    if (pr) { S.planes.precios = S.planes.precios || {}; const n = Number(e.target.value.replace(/\D/g, '')); if (n) S.planes.precios[pr] = n; S.planes.guardado = false; }
  });
  document.addEventListener('change', (e) => {
    const k = e.target.getAttribute('data-cambio');
    if (k === 'rol') { S.login.rol = e.target.value; render(); document.querySelector(`input[value=${S.login.rol}]`).focus(); }
    if (k === 'escenario') { Object.assign(S.pago, { escenario: e.target.value, socio: null, error: null, ok: false, ref: '' }); render(); }
    if (k === 'autoriza') { S.socio.autoriza = e.target.checked; S.socio.intento = false; S.socio.ok = false; render(); }
  });
  document.addEventListener('submit', (e) => {
    const k = e.target.getAttribute('data-envio');
    if (!k) return;
    e.preventDefault();
    if (k === 'login') { S.rol = S.login.rol; ir('recepcion'); }
    if (k === 'consultar') { S.consulta.buscado = S.consulta.doc.trim() || null; render(); const i = document.getElementById('doc'); if (i) i.focus(); }
    if (k === 'movil') { S.movil.buscado = S.movil.doc.trim() || null; render(); }
    if (k === 'planes') { S.planes.guardado = true; render(); }
    if (k === 'socio') {
      const n = S.socio.numero.trim();
      S.socio.intento = true;
      S.socio.ok = !!n && n !== '1090123456' && S.socio.autoriza;
      if (S.socio.ok && !SOC[n]) SOC[n] = { nombre: 'María Fernanda Gil', tipo: 'PPT', estado: 'SIN_MEMBRESIA' };
      render();
    }
  });
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-accion]');
    if (!el) return;
    const a = el.getAttribute('data-accion'), v = el.getAttribute('data-valor');
    if (a === 'salir') { S.rol = null; ir('login'); return; }
    if (a === 'ejemplo') { S.consulta.doc = v; S.consulta.buscado = v; render(); return; }
    if (a === 'ejemplo-ir') { S.consulta.doc = v; S.consulta.buscado = v; return; }
    if (a === 'ejemplo-m') { S.movil.doc = v; S.movil.buscado = v; render(); return; }
    if (a === 'escenario') { Object.assign(S.pago, { escenario: v, socio: el.getAttribute('data-socio') || null, error: null, ok: false, ref: '' }); return; }
    if (a === 'plan' && !S.pago.ok) { S.pago.plan = v; S.pago.error = null; render(); return; }
    if (a === 'medio' && !S.pago.ok) { S.pago.medio = v; S.pago.error = null; render(); return; }
    if (a === 'confirmar-pago') {
      if (S.pago.ok) return;
      const pide = S.pago.medio !== 'Efectivo', ref = (S.pago.ref || '').trim();
      if (pide && !ref) S.pago.error = 'vacia';
      else if (pide && ref.toUpperCase() === 'M123456') S.pago.error = 'dup';
      else { S.pago.ok = true; S.pago.error = null; }
      render(); return;
    }
    if (a === 'abrir-anulacion') { S.hist.confirmando = true; render(); const t = document.getElementById('motivo'); if (t) t.focus(); return; }
    if (a === 'cancelar-anulacion') { S.hist.confirmando = false; S.hist.falta = false; render(); return; }
    if (a === 'confirmar-anulacion') {
      if (!(S.hist.motivo || '').trim()) { S.hist.falta = true; render(); return; }
      S.hist.anulado = true; S.hist.confirmando = false;
      Object.assign(SOC['1090123456'], { estado: 'VENCIDO', vence: '21/09/2026' });
      render(); return;
    }
    if (a === 'desbloquear') { S.personal.desbloqueado = true; render(); return; }
    if (a === 'restablecer') { S.personal.restablecida = true; render(); return; }
  });
  render();
})();
</script>
</body>
</html>
