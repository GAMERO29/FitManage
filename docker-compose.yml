# FitManage en tu máquina: PostgreSQL 16 + migraciones + la API con gunicorn (Guía 10, ADR N.° 10).
#
#   cp .env.example .env        # y cambie los tres valores (el archivo .env nunca se sube)
#   docker compose up -d --build
#   docker compose ps           # db y app en "healthy"; migrar en "exited (0)"
#   docker compose down         # apaga sin borrar datos (el volumen "datos" se conserva)
#   docker compose down -v      # apaga y BORRA la base
#
#   docker compose --profile pruebas run --rm pruebas   # la suite completa contra este PostgreSQL
#
# Observabilidad (Guía 13, ADR N.° 13): Prometheus, Grafana y Jaeger junto a la app.
#   docker compose --profile observabilidad up -d --build
#   Grafana en http://127.0.0.1:3000 (tablero «FitManage · API»), Jaeger en http://127.0.0.1:16686
#   Requiere FITMANAGE_METRICAS_TOKEN y OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 en .env.

x-entorno-app: &entorno-app
  DATABASE_URL: postgresql://fitmanage:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-fitmanage}
  TZ: America/Bogota

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitmanage}
      POSTGRES_USER: fitmanage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - datos:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmanage -d fitmanage"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrar:
    image: ${FITMANAGE_IMAGEN:-fitmanage:local}
    build:
      context: .
      target: produccion
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *entorno-app
    networks: [interna]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${FITMANAGE_IMAGEN:-fitmanage:local}
    build:
      context: .
      target: produccion
    environment:
      <<: *entorno-app
      JWT_CLAVE: ${JWT_CLAVE:?Defina JWT_CLAVE en .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY en .env}
      # Sin token, /metrics responde 404. Sin colector, las trazas no salen del proceso.
      FITMANAGE_METRICAS_TOKEN: ${FITMANAGE_METRICAS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    ports:
      - "127.0.0.1:8000:8000" # solo desde esta máquina
    networks: [interna, publica, telemetria]
    depends_on:
      migrar:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  pruebas:
    profiles: [pruebas]
    build:
      context: .
      target: pruebas
    environment: *entorno-app
    networks: [interna]
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    profiles: [observabilidad]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d # ADR N.° 13: dos semanas de métricas
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./observabilidad/prometheus:/etc/prometheus:ro
      - metricas:/prometheus
    secrets:
      - source: metricas_token
        target: /etc/prometheus-secretos/token
    ports:
      - "127.0.0.1:9090:9090"
    networks: [telemetria, publica]
    depends_on: [app]
    restart: unless-stopped

  jaeger:
    profiles: [observabilidad]
    image: jaegertracing/jaeger:2.21.0 # recibe OTLP en 4318 y guarda las trazas en memoria
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0 # escuchar en la red de compose, no solo dentro del contenedor
    ports:
      - "127.0.0.1:16686:16686"
    networks: [telemetria, publica]
    restart: unless-stopped

  grafana:
    profiles: [observabilidad]
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # solo en 127.0.0.1: el visitante anónimo solo puede ver
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_CLAVE:-cambie-esta-clave}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/fitmanage.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [telemetria, publica]
    depends_on: [prometheus, jaeger]
    restart: unless-stopped

secrets:
  metricas_token:
    environment: FITMANAGE_METRICAS_TOKEN

volumes:
  datos:
  metricas:

networks:
  interna:
    internal: true # sin salida a internet: la base solo habla con la app
  telemetria:
    internal: true # la app, Prometheus, Jaeger y Grafana; la base no está en esta red
  publica:
