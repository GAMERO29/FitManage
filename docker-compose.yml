# Uso: copie .env.example a .env, ponga una contraseña y ejecute
#   docker compose up --build --abort-on-container-exit --exit-code-from app
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fitmanage
      POSTGRES_USER: fitmanage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmanage -d fitmanage"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - datos:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fitmanage:${POSTGRES_PASSWORD}@db:5432/fitmanage
      TZ: America/Bogota
    command: pytest

volumes:
  datos:
